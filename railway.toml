# Railway — https://railway.app
# New Project → Deploy from GitHub → Root Directory: IOT
# Variables: GEMINI_API_KEY, PLATFORM_API_KEY, (선택) PORT
# Start command 는 UI에서 bash start_paas.sh 로 맞출 것.

[build]
builder = "nixpacks"

[deploy]
startCommand = "bash start_paas.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
