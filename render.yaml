# Render Blueprint — https://render.com/docs/blueprint-spec
# New → Blueprint → 이 저장소 연결 후 배포.
# Dashboard: VITE_API_BASE = https://<onsalpim-api>.onrender.com/api
# Care 앱: EXPO_PUBLIC_API_BASE = 같은 API URL (care·dashboard URL 넣으면 404)

services:
  - type: web
    name: onsalpim-api
    runtime: python
    rootDir: IOT
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start_paas.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
      - key: PLATFORM_API_KEY
        sync: false
    healthCheckPath: /api/health

  # Static site — CDN만 쓰므로 plan 필드 없음 (free plan 은 Python Web 전용)
  - type: web
    name: onsalpim-dashboard
    runtime: static
    rootDir: IOT/dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        sync: false

  # 복지사 앱 (Expo → 정적 웹). Mac Metro 없이 URL 로 접속 — 홈 화면에 추가 가능
  - type: web
    name: onsalpim-care
    runtime: static
    rootDir: mobile
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_API_BASE
        sync: false
